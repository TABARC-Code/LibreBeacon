[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "librebeacon"
version = "1.9.3"
description = "Optional accessibility companion for FreeStyle Libre readings shared through Home Assistant"
requires-python = ">=3.11"
dependencies = ["keyring>=25,<27"]
license = "MIT"

[project.optional-dependencies]
windows-build = ["pyinstaller>=6,<7"]

[project.scripts]
librebeacon = "librebeacon.app:main"

[tool.setuptools.packages.find]
include = ["librebeacon*"]
